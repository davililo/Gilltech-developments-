<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose how to send your request</title>
  <meta name="theme-color" content="#061326">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/gilltech-favicon.png">
  <style>
    :root {
      --navy-950: #061326;
      --navy-900: #091c34;
      --cyan: #21d4fd;
      --white: #ffffff;
      --muted: #61738c;
      --line: #dce8f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#061326,#0d2345);
      color: var(--white);
    }
    .popup {
      width: min(400px, calc(100% - 32px));
      padding: 28px 22px 20px;
      background: rgba(9,28,52,0.96);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.28);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
      line-height: 1.2;
    }
    p {
      margin: 0 0 22px;
      color: rgba(255,255,255,0.7);
      font-size: 0.95rem;
    }
    .actions {
      display: grid;
      gap: 12px;
    }
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: transform .2s ease;
    }
    .action:hover { transform: translateY(-2px); }
    .whatsapp { color: #fff; background: #19bb64; }
    .whatsapp { gap: 9px; }
    .whatsapp img { width: 25px; height: 25px; border-radius: 50%; object-fit: cover; }
    .email { color: #061326; background: #21d4fd; }
    .close { color: #fff; background: transparent; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="popup" id="send-choice-page">
    <h1>Send your request</h1>
    <p>Choose how you want to continue. You can send the same message by WhatsApp or email.</p>
    <div class="actions">
      <a class="action whatsapp" data-send-whatsapp href="https://wa.me/254743123507" target="_blank" rel="noopener"><img src="watermarked_img_3745967122321620394.jpg" alt="WhatsApp icon">Send on WhatsApp</a>
      <a class="action email" data-send-email href="mailto:hello@davidmgilltech.co.ke" target="_blank" rel="noopener">Send email</a>
      <a class="action close" href="javascript:window.close();">Close</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
